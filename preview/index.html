const DATA = {"docs": [{"id": "readme", "label": "README", "path": "README.md", "md": "# Liferay Migration Studio\n\n> **Coming soon.** This page describes a tool in development. There's nothing to download yet.\n\nMove content from systems with an API into **Liferay DXP**. You map the source to Liferay in a\nweb UI, check every request with a dry run, load, then validate the result against the source.\nLoads can be stopped and re-run without creating duplicates.\n\n## First example: Liferay 2024.Q1 Web Content \u2192 the new CMS in 2026.Q3\n\nLiferay 2026.Q3 introduces a new CMS built on Spaces. Migration Studio moves classic Web Content\ninto it:\n\n| From Liferay 2024.Q1 | To Liferay 2026.Q3 |\n|---|---|\n| Web content structures | CMS content structures |\n| Web content articles, with their translations | CMS entries |\n| Select, radio and multi-select options | Picklists |\n| Documents and Media folders and files | Space documents and folders |\n| Vocabularies and categories, including nested ones | Vocabularies and categories |\n\nImages and links inside article text are rewritten to point at the migrated documents.\n\n**Tested on real Liferay, from `2024.q1.32` to `2026.q3.9`** (a sandbox with sample content):\n\n* All 200 sample articles (English and Spanish), 14 documents, 3 structures and a 3-level\n  category tree loaded on the first run, with no errors.\n* Validation read 100 migrated articles back from Liferay and compared them with the source:\n  no differences.\n* Running the load again changed nothing.\n\nLiferay 2025.Q1 has been tested the same way. See\n[the migration guide](docs/liferay-web-content-to-cms.md) for what's migrated and what isn't.\n\n## How it works\n\n1. **Connect** the source and your Liferay DXP.\n2. **Map** what goes where: entities, fields and transformations, in the UI. Ready-made\n   mappings cover the example above.\n3. **Run order is worked out for you.** Vocabularies come before categories, parent categories\n   before their children, documents before the articles that use them. You can change the order\n   in the UI.\n\n   ![The run order, worked out from the mappings](docs/run-order.png)\n\n4. **Dry run.** Every request the load would make, with nothing written.\n5. **Load.** Handles large volumes in parallel batches. It can be stopped and resumed, and a\n   delta load at cutover writes only what changed.\n6. **Validate.** Record counts, plus a field-by-field comparison of a sample of migrated\n   records against the source.\n\n## Optional AI help\n\nEverything works without AI. With an AI model of your choice (a hosted service or a model you\nrun yourself), Migration Studio can:\n\n* suggest field mappings for you to accept or reject,\n* explain why records failed validation, with evidence,\n* answer questions about a migration in a chat. It can run checks and dry runs, but only\n  proposes loads for you to confirm.\n\n## Preview documentation\n\n* [How it works](docs/how-it-works.md): connect, extract, map, run order, dry run, load, validate\n* [Liferay Web Content \u2192 the new CMS](docs/liferay-web-content-to-cms.md): what's migrated, field\n  types, what isn't, and the before and after checklist\n* [AI help](docs/ai.md): mapping suggestions, explaining validation problems, and Ask\n* [Security and data](docs/security-and-data.md): where it runs, where data goes, safeguards\n\n## Planned sources\n\n* Liferay Web Content from 2024.Q1 and later (above)\n* SharePoint discussion boards \u2192 Liferay Forums\n* Other systems through their REST API, or CSV files\n\n## Requirements\n\n* **Liferay DXP** 2026.Q1 or later as the target. Liferay Community Edition isn't supported.\n* Docker, on a laptop or a server.\n\n---\n\nLiferay and Liferay DXP are trademarks of Liferay, Inc.\n"}, {"id": "how-it-works", "label": "How it works", "path": "docs/how-it-works.md", "md": "# How it works\n\n> **Preview.** Liferay Migration Studio is in development. Details can change before release.\n\n![How a migration flows: sources, extract, map, load into Liferay DXP, validate](how-a-migration-flows.svg)\n\nA migration is a **project**: where the data comes from, where it goes in Liferay, and how each\nfield maps. You build it in the web UI, or start from a ready-made project for a common migration\nand adjust it.\n\n## 1. Connect\n\nA **connection** is a system's address and how to sign in to it: Basic, OAuth 2, an API key or a\nbearer token. Passwords and keys are read from environment variables on the server, so a project\ncan be shared or exported without them.\n\nSources can be Liferay itself (2024.Q1 and later), other systems with a REST API, or CSV files.\nThe target is **Liferay DXP 2026.Q1 or later**.\n\n## 2. Extract\n\nStudio reads every source record and stages it on disk before anything is written. It handles\npaged APIs, nested collections (for example the categories of each vocabulary), trees, and file\ndownloads.\n\n* Extraction saves its progress after every page, so it resumes where it stopped.\n* At cutover, a **delta** extract reads only what changed since the last one.\n* A rate limit protects a production source.\n\n## 3. Map\n\nA **mapping** sends one kind of source record (articles, say) to one kind of Liferay record\n(CMS entries). Each mapping has field rules:\n\n* copy a field, set a fixed value, or build one from a template;\n* transform it: dates, text, lists, value lookups, localized values;\n* look up a record another mapping migrated, such as an article's categories, and use its new ID.\n\n**Preview** shows the exact request a mapping would send for real source records, before any load.\n\n## 4. Run order, worked out for you\n\nMappings that look up other mappings run after them. Studio works the order out from the\nmappings themselves: vocabularies before categories, folders before documents, documents before\nthe articles whose text links to them. Within a tree such as nested categories, parents are\nwritten before their children.\n\n![The run order, worked out from the mappings](run-order.png)\n\nYou can add a dependency by dragging from one mapping to another, or pin an order. Studio warns\nif a pin contradicts a dependency.\n\n## 5. Dry run, then load\n\nA **dry run** builds every request the load would send and writes nothing, so you can review it.\n\nThe **load** writes in parallel chunks and can be stopped and resumed. Every migrated record\ngets a stable **external reference code**, so:\n\n* running a load again updates records instead of duplicating them;\n* records that haven't changed since the last load aren't sent again;\n* a delta load at cutover writes only what changed.\n\nLoads go into **Liferay DXP** only. Studio checks the target's edition before loading and\nrefuses Liferay Community Edition.\n\n## 6. Validate\n\nValidation compares the migration with the source:\n\n* record counts, and which records weren't loaded and why;\n* a **spot check**: a sample of migrated records is read back from Liferay and compared field\n  by field with what was sent;\n* **dependencies**: records whose related records weren't migrated, such as a forum message whose\n  author wasn't imported.\n\nEach problem points at the records involved. With an AI model connected, Studio can also explain\nthe causes: see [AI help](ai.md).\n\n## Ways to drive it\n\n* The **web UI**, for everything above.\n* The **command line**, for scripts and scheduled cutover runs.\n* An **MCP server**, so Claude or another AI assistant can check status, start dry runs and read\n  reports. See [AI help](ai.md).\n"}, {"id": "web-content-to-cms", "label": "Web Content \u2192 CMS", "path": "docs/liferay-web-content-to-cms.md", "md": "# Liferay Web Content \u2192 the new CMS\n\n> **Preview.** Liferay Migration Studio is in development. Details can change before release.\n\nThis ready-made migration moves one site's classic Web Content from **Liferay 2024.Q1 or later**\ninto a **Space** of the new CMS in **Liferay DXP 2026.Q1 or later**. Everything in it is ordinary\nproject configuration, so you can change any part of it in the UI.\n\n## Tested\n\nOn real Liferay, from `liferay/dxp:2024.q1.32` to `liferay/dxp:2026.q3.9`, with sample content:\n\n| | Loaded | Read back and compared |\n|---|---|---|\n| Articles (English and Spanish) | 200 of 200 | 100, no differences |\n| Documents | 14 of 14 | |\n| Structures | 3 of 3 | |\n| Categories (3 levels) | 5 of 5 | |\n\nThere were no errors on the first load, and running it again changed nothing. The same migration\nfrom `liferay/dxp:2025.q1.29-lts`, with 339 articles, gave the same result, and a delta load wrote\nonly the articles added or changed since the first load.\n\n## What's migrated\n\n| From Web Content | To the new CMS | |\n|---|---|---|\n| Vocabularies and categories | Vocabularies and categories | Nested categories keep their tree. Vocabularies the target already has, such as *Topic*, are reused, not duplicated. |\n| Documents and Media folders and files | Space folders and documents | |\n| Select, radio and multi-select options | Picklists | One per field. |\n| Web content structures | CMS content structures | Field by field (see below). Site and global structures. |\n| Articles | CMS entries | Every translation. Categories and keywords. |\n\n**Run order:** vocabularies, document folders and picklists first; then categories and\nstructures; then documents; then articles, which need all of them.\n\nImages and links inside article text are rewritten to point at the migrated Space documents.\n\n## Field types\n\n| Web content field | CMS field |\n|---|---|\n| Text, text box | Long text |\n| Rich text | Rich text, with migrated image and document links rewritten |\n| Select, radio | Picklist |\n| Multi-select, checkboxes | Multi-select picklist |\n| A single checkbox (yes/no) | Boolean |\n| Integer, decimal | Integer, decimal |\n| Date, date and time | Date, date and time |\n| Image, document | Text: the URL of the migrated Space document |\n| Link to another article | Text: the migrated entry's external reference code |\n| Link to a page, geolocation | Text |\n| Fieldset | Its fields, flattened |\n| Repeatable field or fieldset | Long text, as JSON |\n\nEach structure also gets the article's original ID, friendly URL, folder, author and dates, in\nfields starting with `legacy`, so nothing is lost and redirects can be built later.\n\n### Why some fields become text\n\n* **Images and documents:** 2026.Q3's API doesn't yet accept attachment values for CMS entries.\n  The files are uploaded to the Space, and the field holds their new URL.\n* **Links to other articles:** kept as the migrated entry's reference code, so they can become\n  relationships later.\n* **Repeatable fields:** kept as JSON until filling CMS repeatable groups through the API is\n  confirmed.\n\n## Not migrated\n\n* **Templates** (FTL) and ADTs. Rebuild them as display page templates or fragments.\n* **Version history and drafts.** Only the latest approved version of each article.\n* **Original author and dates** as the entry's own. The CMS sets them at migration time; the\n  originals are kept in the `legacy` fields.\n* **Friendly URLs** as the entry's own. They're kept in a `legacy` field for redirects.\n* **Permissions.** Grant VIEW on the migrated content structures after loading.\n* **Comments, ratings and related assets.**\n\n## Before and after loading\n\n**Before:**\n\n* Turn off email notifications and subscriptions on the target, and workflow for CMS structures,\n  so migrated entries don't notify users or wait for approval.\n* Do a dry run and review it.\n\n**After:**\n\n* Grant VIEW on each migrated content structure (CMS \u2192 Admin \u2192 Content Structures \u2192 Permissions).\n  Custom structures have it turned off by default.\n* Run validation.\n* At cutover, run a delta extract and load to pick up what changed since the first load.\n\n## Large sites\n\nDocuments and articles load in parallel; you can raise or lower that per mapping. On a production\nsource, set a request rate limit on the connection.\n"}, {"id": "ai", "label": "AI help", "path": "docs/ai.md", "md": "# AI help\n\n> **Preview.** The AI features are in development. Details can change before release.\n\n**Everything in Liferay Migration Studio works without AI.** AI is off until you connect a model,\nand you choose which one:\n\n* a hosted model, through Anthropic's API or any OpenAI-compatible API, with your own key;\n* or a model you run yourself (for example with Ollama, LM Studio or vLLM), which needs no key and\n  keeps everything on your own infrastructure.\n\n## What it does\n\n### Suggest field mappings\n\nOn a mapping, **Suggest with AI** proposes which source field goes to which Liferay field, each\nwith a confidence and a reason. You accept or reject each suggestion; nothing changes until you do.\n\nThe model sees the field names and types of both sides. A few sample values help it match, and\nyou can turn them off or replace them with their type. **Suggest (no AI)** matches names and\ntypes without any model.\n\n### Explain validation problems\n\nWhen validation finds problems, **Investigate with AI** looks at the records involved and reports\none finding per cause: the affected records, the evidence, a suggested fix and how confident it\nis. For example: *\"12 articles failed because their structure wasn't migrated: the structures\nmapping is turned off.\"*\n\nIt can also read the source and target Liferay through their MCP servers: the Liferay Legacy MCP\nserver for 2024.Q1 to 2025.Q4, and Liferay DXP 2026.Q1+'s own MCP server.\n\n### Ask about a migration\n\n**Ask** is a chat about the open project: *\"Is it safe to load the articles now?\"*, *\"Why did\nrecords fail in the last load?\"*\n\n* It can read the project and its runs, reports and issues.\n* It can start runs that don't write to Liferay: extract, dry run, validate and investigate.\n* It **can't load**. It can only propose a load, which runs when you click **Run it**.\n\n## What the AI can't do\n\n* **Write to Liferay.** The AI only gets read-only tools. Tools from MCP servers are offered only\n  if they're read-only, and the rest are blocked and listed in Settings. On Liferay's own MCP\n  server, only read operations are let through.\n* **Load from the chat.** In Ask, a load always needs a person to confirm it.\n* **See records you don't want it to see.** With **Let the AI read record contents** turned off,\n  the investigation and Ask tools show the AI counts, messages and mapping rules, but no record\n  contents.\n* **Receive bulk data.** The model works with summaries and individual records it asks for.\n  Migrated data never passes through it.\n\n## Use your own AI assistant\n\nStudio includes an MCP server, so Claude or another MCP client can work with migrations from your\nown assistant: list projects, check run status, start runs and read validation reports. Runs it\nstarts are dry runs unless it asks for a real load, and assistants such as Claude ask you before\nrunning a tool that can write. On a server it uses the same access token as the web UI.\n"}, {"id": "security", "label": "Security and data", "path": "docs/security-and-data.md", "md": "# Security and data\n\n> **Preview.** Liferay Migration Studio is in development. Details can change before release.\n\n## Where it runs\n\nLiferay Migration Studio is a Docker container that runs on your own infrastructure: a laptop\nfor one person, or a server for a team. There's no hosted service and nothing to sign up for.\n\n## Where your data goes\n\n* **Only to the systems you connect.** Studio reads from the source connections and writes to\n  the Liferay DXP target. It makes no other connections, apart from the AI model if you set one up.\n* **AI is off until you connect a model.** If you use a model you run yourself, nothing leaves\n  your network. See [AI help](ai.md) for what a model can see.\n* **Staged data stays with Studio.** Records and files read from the source are kept on Studio's\n  own disk, and its project data in its database (built in, or PostgreSQL on a server).\n  Deleting a project removes both.\n\n## Credentials\n\n* Keep passwords and keys in **environment variables** on the server, and refer to them by name\n  in a project. Exporting or sharing the project then never includes them.\n* Give the source connection read access only. The target connection needs to write only the\n  content being migrated.\n\n## Access\n\n* On a laptop, Studio listens only on your own machine.\n* On a server, an **access token** protects the web UI, the API and the MCP server. Studio warns\n  if it's reachable on a network without one. Put HTTPS in front of it.\n\n## Safeguards\n\n* **Dry runs** show every request a load would send, without writing anything.\n* **The built-in AI chat can't load.** It can only propose a load, which runs when a person\n  confirms it.\n* **AI assistants connected over MCP start dry runs by default.** A real load has to be asked\n  for explicitly, and assistants such as Claude ask you before running a tool that can write.\n* **Re-runs are safe.** Every migrated record has a stable external reference code, so running a\n  load again updates records instead of duplicating them.\n* **Liferay DXP only.** Studio checks the target before loading and refuses Liferay Community\n  Edition.\n* **The container runs as an unprivileged user.**\n"}], "images": {"run-order.png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAAOECAIAAACU6c44AAAQAElEQVR4nOzdBXgURxsH8Ik7cRdihODu7u7upUhLC5RSSkuF0n60QCmF4u7u7u4BkhCIE3d31+/dWziOJHe5u1zQ/+/Jk2dvb2V2b3Z2553dWdXS0lIG8FEIiYi3NDNkAAAAAAAA8O4oMwAAAAAAAAAABUGgAQAAAAAAAAAUBoEGAAAAAAAAAFAYBBoAAAAAAAAAQGEQaAAAAAAAAAAAhUGgAQAAAAAAAAAUBoEGAAAAAAAAAFAYBBoAAAAAAAAAQGEQaAAAAAAAAAAAhUGgAQAAAAAAAAAUBoEGAAAAAAAAAFAYBBoAAAAAAAAAQGEQaAAAAAAAAAAAhUGgAQAAAAAAAAAUBoEGAAAAAAAAAFAYBBoAAAAAAAAAQGEQaAAAAAAAAAAAhUGgAQAAAAAAAAAUBoEGAAAAAAAAAFAYBBoAAAAAAAAAQGEQaAAAAA const byPath = Object.fromEntries(DATA.docs.map(d => [d.path, d]));

function resolve(href, fromPath) {
  if (!href || /^[a-z]+:/i.test(href) || href.startsWith("#")) return null;
  const base = fromPath.includes("/") ? fromPath.slice(0, fromPath.lastIndexOf("/") + 1) : "";
  const parts = (base + href).split("/"); const out = [];
  for (const p of parts) { if (p === "..") out.pop(); else if (p && p !== ".") out.push(p); }
  return out.join("/");
}

function render(doc) {
  const html = marked.parse(doc.md, { gfm: true });
  const el = document.getElementById("md");
  el.innerHTML = html;

  for (const a of el.querySelectorAll("a[href]")) {
    const target = resolve(a.getAttribute("href"), doc.path);
    if (target && byPath[target]) a.setAttribute("href", "#" + byPath[target].id);
    else if (!a.getAttribute("href").startsWith("#")) { a.target = "_blank"; a.rel = "noopener"; }
  }
  for (const img of el.querySelectorAll("img")) {
    const name = (img.getAttribute("src") || "").split("/").pop();
    if (DATA.images[name]) img.src = DATA.images[name];
    img.loading = "eager";
  }
  for (const t of el.querySelectorAll("table")) {
    const box = document.createElement("div"); box.className = "table";
    t.replaceWith(box); box.appendChild(t);
  }
  document.getElementById("filehead").textContent = doc.path;
  for (const a of document.querySelectorAll("#files a")) { if (a.dataset.id === doc.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
}

const files = document.getElementById("files");
for (const d of DATA.docs) {
  const a = document.createElement("a");
  a.href = "#" + d.id; a.dataset.id = d.id;
  a.innerHTML = `${d.label}<small>${d.path}</small>`;
  files.appendChild(a);
}

function show() {
  const id = location.hash.slice(1);
  const doc = DATA.docs.find(d => d.id === id) || DATA.docs[0];
  render(doc);
}
window.addEventListener("hashchange", () => { show(); window.scrollTo(0, 0); });
show();
